      discovery_rules:
        - uuid: 52b14ad84f0a427a95bcc436a5a1bf6c
          name: 'Descoberta de produtos'
          type: HTTP_AGENT
          key: shop.products.discovery
          delay: 1h
          description: 'Lê o catálogo em /api/products para criar itens de estoque e de sacola por produto.'
          item_prototypes:
            - uuid: e8ca7724e97f431e8a9b3459e8555878
              name: 'Adicionados à sacola: {#PRODUCT.NAME}'
              type: TELEMETRY_QUERY
              key: 'shop.cart.added[{#PRODUCT.ID}]'
              delay: '{$SHOP.FREQUENCY}'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '0'
                    - '^No value$'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '{"columns":{"value":0}}'
                - type: JSONPATH
                  parameters:
                    - $.columns.value
              time_shift: '{$SHOP.TIMESHIFT}'
              lookback_limit: '{$SHOP.LOOKBACK}'
              granularity: '{$SHOP.GRANULARITY}'
              query:
                signal_type: METRICS
                aggregated_columns:
                  - function: SUM
                    column: Value
                    alias: value
                filter:
                  evaltype: AND
                  conditions:
                    - column: Attributes
                      attribute_key: shop.product.id
                      value: '{#PRODUCT.ID}'
                    - column: MetricName
                      value: shop.cart.items_added
                    - column: ServiceName
                      value: '{$SHOP.SERVICE.NAME}'
              tags:
                - tag: component
                  value: vendas
                - tag: produto
                  value: '{#PRODUCT.ID}'
            - uuid: 0de74b6dda564984b499530b1bc1cfe8
              name: 'Estoque: {#PRODUCT.NAME}'
              type: TELEMETRY_QUERY
              key: 'shop.stock[{#PRODUCT.ID}]'
              delay: '{$SHOP.FREQUENCY}'
              description: 'Menor estoque observado no minuto.'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '0'
                    - '^No value$'
                - type: JSONPATH
                  parameters:
                    - $.columns.value
              time_shift: '{$SHOP.TIMESHIFT}'
              lookback_limit: '{$SHOP.LOOKBACK}'
              granularity: '{$SHOP.GRANULARITY}'
              query:
                signal_type: METRICS
                metric_point_type: GAUGE
                aggregated_columns:
                  - function: MIN
                    column: Value
                    alias: value
                filter:
                  evaltype: AND
                  conditions:
                    - column: Attributes
                      attribute_key: shop.product.id
                      value: '{#PRODUCT.ID}'
                    - column: MetricName
                      value: shop.inventory.stock
                    - column: ServiceName
                      value: '{$SHOP.SERVICE.NAME}'
              tags:
                - tag: component
                  value: estoque
                - tag: produto
                  value: '{#PRODUCT.ID}'
              trigger_prototypes:
                - uuid: 38b8b6909b26473182e2506a80ea4cca
                  expression: 'last(/Loja Zabbix Lab by OTLP/shop.stock[{#PRODUCT.ID}])<={$SHOP.STOCK.LOW}'
                  name: 'Estoque baixo: {#PRODUCT.NAME} ({ITEM.LASTVALUE1})'
                  priority: WARNING
                  dependencies:
                    - name: 'Produto esgotado: {#PRODUCT.NAME}'
                      expression: 'last(/Loja Zabbix Lab by OTLP/shop.stock[{#PRODUCT.ID}])=0'
                  tags:
                    - tag: scope
                      value: capacity
                - uuid: fc7e7fe48020489ba261e3db41f2c90c
                  expression: 'last(/Loja Zabbix Lab by OTLP/shop.stock[{#PRODUCT.ID}])=0'
                  name: 'Produto esgotado: {#PRODUCT.NAME}'
                  priority: HIGH
                  description: 'O estoque do produto chegou a zero. A loja reabastece a cada RESTOCK_INTERVAL_MINUTES.'
                  tags:
                    - tag: scope
                      value: availability
          url: '{$SHOP.URL}/api/products'
          lld_macro_paths:
            - lld_macro: '{#PRODUCT.ID}'
              path: $.id
            - lld_macro: '{#PRODUCT.NAME}'
              path: $.name
      tags:
        - tag: class
          value: application
        - tag: target
          value: shop-demo
      macros:
        - macro: '{$SHOP.CHECKOUT.DURATION.WARN}'
          value: '2'
          description: 'Duração média do checkout (s) em um minuto que gera alerta.'
        - macro: '{$SHOP.ERROR.LOGS.WARN}'
          value: '0'
          description: 'Logs ERROR em 5 minutos acima deste valor geram alerta.'
        - macro: '{$SHOP.FREQUENCY}'
          value: 1m
          description: 'Intervalo de coleta dos itens.'
        - macro: '{$SHOP.GRANULARITY}'
          value: 1m
          description: 'Janela de agregação de cada valor.'
        - macro: '{$SHOP.LOGIN.FAILURE.WARN}'
          value: '5'
          description: 'Falhas de login em 5 minutos que geram alerta.'
        - macro: '{$SHOP.LOOKBACK}'
          value: 10m
          description: 'Período máximo consultado quando a coleta fica atrasada.'
        - macro: '{$SHOP.NODATA.PERIOD}'
          value: 5m
          description: 'Período sem telemetria da aplicação que gera alerta.'
        - macro: '{$SHOP.NOSALES.PERIOD}'
          value: 30m
          description: 'Período sem nenhuma venda confirmada que gera alerta informativo.'
        - macro: '{$SHOP.PAYMENT.DECLINE.WARN}'
          value: '20'
          description: 'Taxa de recusa de pagamentos (%) nos últimos 10 minutos que gera alerta.'
        - macro: '{$SHOP.PAYMENT.MIN.ATTEMPTS}'
          value: '5'
          description: 'Mínimo de tentativas de pagamento em 10 minutos para avaliar a taxa de recusa.'
        - macro: '{$SHOP.SERVICE.NAME}'
          value: zabbix-shop-demo
          description: 'Valor de service.name enviado pela aplicação (OTEL_SERVICE_NAME).'
        - macro: '{$SHOP.STOCK.LOW}'
          value: '3'
          description: 'Estoque igual ou abaixo deste valor gera alerta de estoque baixo.'
        - macro: '{$SHOP.TIMESHIFT}'
          value: 30s
          description: 'Atraso aplicado às consultas, para dar tempo de a telemetria chegar ao ClickHouse.'
        - macro: '{$SHOP.URL}'
          value: 'http://shop-app:8080'
          description: 'URL interna da loja, usada pela descoberta de produtos (/api/products).'
  triggers:
    - uuid: 7ed8ad8f64bf4883a5d366dba29102f7
      expression: 'last(/Loja Zabbix Lab by OTLP/shop.payment.decline.rate)>{$SHOP.PAYMENT.DECLINE.WARN} and (sum(/Loja Zabbix Lab by OTLP/shop.orders.declined,10m)+sum(/Loja Zabbix Lab by OTLP/shop.orders.confirmed,10m))>={$SHOP.PAYMENT.MIN.ATTEMPTS}'
