zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: b1db56cbb7ff4ef2aa416255541c0c59
      template: 'Loja Zabbix Lab by OTLP'
      name: 'Loja Zabbix Lab by OTLP'
      description: 'Monitora a loja de exemplo do laboratório Zabbix 8.0 a partir da telemetria OpenTelemetry gravada no ClickHouse (itens Telemetry query). Requer métricas com temporalidade delta (OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=delta).'
      groups:
        - name: Templates/Applications
      items:
        - uuid: f492603b12704155b3a6f04a032b8d0f
          name: 'Itens adicionados à sacola'
          type: TELEMETRY_QUERY
          key: shop.cart.items_added
          delay: '{$SHOP.FREQUENCY}'
          description: 'Unidades adicionadas à sacola por minuto.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '0'
                - '^No value$'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{"columns":{"value":0}}'
            - type: JSONPATH
              parameters:
                - $.columns.value
          time_shift: '{$SHOP.TIMESHIFT}'
          lookback_limit: '{$SHOP.LOOKBACK}'
          granularity: '{$SHOP.GRANULARITY}'
          query:
            signal_type: METRICS
            aggregated_columns:
              - function: SUM
                column: Value
                alias: value
            filter:
              evaltype: AND
              conditions:
                - column: MetricName
                  value: shop.cart.items_added
                - column: ServiceName
                  value: '{$SHOP.SERVICE.NAME}'
          tags:
            - tag: component
              value: vendas
        - uuid: 8122f72634a441bd8c8139b3e7c06f06
          name: 'Checkout: duração média'
          type: DEPENDENT
          key: shop.checkout.duration.avg
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var c = JSON.parse(value).columns; return c.count > 0 ? c.sum / c.count / 1000 : 0;'
          master_item:
            key: shop.checkout.duration.raw
          tags:
            - tag: component
              value: desempenho
          triggers:
            - uuid: 06abdaf71f13408c8433846350b0544f
              expression: 'last(/Loja Zabbix Lab by OTLP/shop.checkout.duration.avg)>{$SHOP.CHECKOUT.DURATION.WARN}'
              name: 'Loja: checkout lento (média {ITEM.LASTVALUE1})'
              priority: WARNING
              tags:
                - tag: scope
                  value: performance
        - uuid: 44f012fff901443ba4d5ad674d8f4a07
          name: 'Checkout: duração máxima'
          type: DEPENDENT
          key: shop.checkout.duration.max
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var c = JSON.parse(value).columns; return c.max / 1000;'
          master_item:
            key: shop.checkout.duration.raw
          tags:
            - tag: component
              value: desempenho
        - uuid: 7c99056479c94fd6af6f7e6491e40a69
          name: 'Checkout: dados do histograma'
          type: TELEMETRY_QUERY
          key: shop.checkout.duration.raw
          delay: '{$SHOP.FREQUENCY}'
          history: 1d
          value_type: TEXT
          description: 'Soma, contagem e máximo do histograma shop.checkout.duration no minuto (ms).'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '0'
                - '^No value$'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{"columns":{"sum":0,"count":0,"max":0}}'
          time_shift: '{$SHOP.TIMESHIFT}'
          lookback_limit: '{$SHOP.LOOKBACK}'
          granularity: '{$SHOP.GRANULARITY}'
          query:
            signal_type: METRICS
            metric_point_type: HISTOGRAM
            aggregated_columns:
              - function: SUM
                column: Sum
                alias: sum
              - function: SUM
                column: Count
                alias: count
              - function: MAX
                column: Max
                alias: max
            filter:
              evaltype: AND
              conditions:
                - column: MetricName
                  value: shop.checkout.duration
                - column: ServiceName
                  value: '{$SHOP.SERVICE.NAME}'
          tags:
            - tag: component
              value: desempenho
        - uuid: 8f698ba113004d8495844453bae17ef4
          name: 'Logins com falha'
          type: TELEMETRY_QUERY
          key: shop.logins.failure
          delay: '{$SHOP.FREQUENCY}'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '0'
                - '^No value$'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{"columns":{"value":0}}'
            - type: JSONPATH
              parameters:
                - $.columns.value
          time_shift: '{$SHOP.TIMESHIFT}'
          lookback_limit: '{$SHOP.LOOKBACK}'
          granularity: '{$SHOP.GRANULARITY}'
          query:
            signal_type: METRICS
            aggregated_columns:
              - function: SUM
                column: Value
                alias: value
            filter:
              evaltype: AND
              conditions:
                - column: Attributes
                  attribute_key: shop.login.outcome
                  value: failure
                - column: MetricName
                  value: shop.logins
                - column: ServiceName
                  value: '{$SHOP.SERVICE.NAME}'
          tags:
            - tag: component
              value: vendas
          triggers:
            - uuid: b2c3243b74f94ba5aef62eec3e796da3
              expression: 'sum(/Loja Zabbix Lab by OTLP/shop.logins.failure,5m)>{$SHOP.LOGIN.FAILURE.WARN}'
              name: 'Loja: muitas falhas de login'
              priority: WARNING
              tags:
