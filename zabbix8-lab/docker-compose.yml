# Ambiente de teste Zabbix 8.0 (trunk) com Zabbix proxy recebendo OpenTelemetry
# e Zabbix MCP server. Variáveis de cada serviço ficam em env/<serviço>/.

name: ${COMPOSE_PROJECT_NAME:-zabbix8-lab}

x-restart: &restart
  restart: unless-stopped

networks:
  zabbix:
    name: zabbix8-lab

services:
  postgres:
    <<: *restart
    image: postgres:${POSTGRES_IMAGE_TAG:-17-alpine}
    container_name: zbx8-postgres
    env_file:
      - env/postgres/postgres.env
    volumes:
      - ${DATA_DIRECTORY:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [zabbix]

  clickhouse:
    <<: *restart
    image: clickhouse/clickhouse-server:${CLICKHOUSE_IMAGE_TAG:-26.8}
    container_name: zbx8-clickhouse
    env_file:
      - env/clickhouse/clickhouse.env
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - ./config/clickhouse/initdb.d:/docker-entrypoint-initdb.d:ro
      - ${DATA_DIRECTORY:-./data}/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [zabbix]

  zabbix-server:
    <<: *restart
    image: zabbix/zabbix-server-pgsql:${ZBX_IMAGE_TAG:-alpine-trunk}
    container_name: zbx8-server
    init: true
    env_file:
      - env/postgres/postgres.env
      - env/common/telemetry.env
      - env/zabbix-server/server.env
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [zabbix]

  zabbix-web:
    <<: *restart
    image: zabbix/zabbix-web-nginx-pgsql:${ZBX_IMAGE_TAG:-alpine-trunk}
    container_name: zbx8-web
    env_file:
      - env/postgres/postgres.env
      - env/common/telemetry.env
      - env/zabbix-web/web.env
    ports:
      - "${ZABBIX_WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks: [zabbix]

  zabbix-agent:
    <<: *restart
    image: zabbix/zabbix-agent2:${ZBX_IMAGE_TAG:-alpine-trunk}
    container_name: zbx8-agent
    hostname: zabbix-agent
    init: true
    env_file:
      - env/zabbix-agent/agent.env
    depends_on:
      - zabbix-server
    networks: [zabbix]

  zabbix-proxy:
    <<: *restart
    image: zabbix/zabbix-proxy-sqlite3:${ZBX_IMAGE_TAG:-alpine-trunk}
    container_name: zbx8-proxy
    init: true
    env_file:
      - env/common/telemetry.env
      - env/zabbix-proxy/proxy.env
    ports:
      - "${ZABBIX_PROXY_PORT:-10061}:10051"
      # OTLP gRPC direto no proxy (sem passar pelo collector)
      - "${ZABBIX_PROXY_OTLP_PORT:-14317}:4317"
    volumes:
      - ${DATA_DIRECTORY:-./data}/zabbix-proxy:/var/lib/zabbix/db_data
    depends_on:
      zabbix-server:
        condition: service_started
      clickhouse:
        condition: service_healthy
    networks: [zabbix]

  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_IMAGE_TAG:-0.163.2}
    container_name: zbx8-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    depends_on:
      - zabbix-proxy
    networks: [zabbix]

  zabbix-mcp-server:
    <<: *restart
    image: zabbix/zabbix-mcp-server:${ZBX_IMAGE_TAG:-alpine-trunk}
    container_name: zbx8-mcp-server
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - env/mcp-server/mcp.env
    ports:
      - "${MCP_SERVER_PORT:-8443}:8443"
    depends_on:
      - zabbix-web
    networks: [zabbix]

  # Loja de exemplo instrumentada com OpenTelemetry (opcional):
  #   docker compose --profile demo up -d --build
  shop-app:
    <<: *restart
    profiles: [demo]
    build:
      context: ./apps/shop-app
    container_name: zbx8-shop-app
    env_file:
      - env/shop-app/app.env
    ports:
      - "${SHOP_APP_PORT:-3001}:8080"
    depends_on:
      - otel-collector
    networks: [zabbix]
