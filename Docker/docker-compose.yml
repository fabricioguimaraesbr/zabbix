# Stack principal: PostgreSQL, ClickHouse, Zabbix Server, Frontend, Agent 2 e Grafana.
# Todos os valores específicos de ambiente vêm de config/<ambiente>.env.
# Execute pela raiz do repositório:  scripts/compose.sh dev core up -d

networks:
  network-zabbix:
    name: ${DOCKER_NETWORK:-zabbix-network}
    driver: bridge

services:
  postgres:
    container_name: zabbix-postgres
    image: postgres:${POSTGRES_IMAGE_TAG:-17-alpine}
    networks:
      - network-zabbix
    volumes:
      - '${DATA_DIR:-./data}/pgsql:/var/lib/postgresql/data'
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?Defina ZABBIX_DB_PASSWORD no arquivo config/<ambiente>.env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:${CLICKHOUSE_IMAGE_TAG:-latest}
    networks:
      - network-zabbix
    ports:
      - '${CLICKHOUSE_HTTP_PORT:-8123}:8123'
      - '${CLICKHOUSE_TCP_PORT:-9000}:9000'
    volumes:
      - '${DATA_DIR:-./data}/clickhouse:/var/lib/clickhouse'
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-zabbix}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-zabbix}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Defina CLICKHOUSE_PASSWORD no arquivo config/<ambiente>.env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    restart: always

  zabbix-server:
    container_name: zabbix-server
    image: zabbix/zabbix-server-pgsql:${ZBX_IMAGE_TAG:-alpine-trunk}
    networks:
      - network-zabbix
    restart: always
    ports:
      - '${ZBX_SERVER_PORT:-10051}:10051'
    volumes:
      - '${DATA_DIR:-./data}/alertscripts:/usr/lib/zabbix/alertscripts'
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?Defina ZABBIX_DB_PASSWORD no arquivo config/<ambiente>.env}
    depends_on:
      postgres:
        condition: service_healthy

  zabbix-frontend:
    container_name: zabbix-frontend
    image: zabbix/zabbix-web-nginx-pgsql:${ZBX_IMAGE_TAG:-alpine-trunk}
    networks:
      - network-zabbix
    restart: always
    ports:
      - '${ZBX_WEB_HTTP_PORT:-80}:8080'
      - '${ZBX_WEB_HTTPS_PORT:-443}:8443'
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?Defina ZABBIX_DB_PASSWORD no arquivo config/<ambiente>.env}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: ${ZBX_SERVER_NAME:-Zabbix}
      PHP_TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started

  grafana:
    container_name: grafana
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-latest}
    networks:
      - network-zabbix
    restart: always
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    volumes:
      - '${DATA_DIR:-./data}/grafana:/var/lib/grafana'
    environment:
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
    depends_on:
      zabbix-server:
        condition: service_started

  zabbix-agent:
    container_name: zabbix-agent
    image: zabbix/zabbix-agent2:${ZBX_IMAGE_TAG:-alpine-trunk}
    user: root
    networks:
      - network-zabbix
    restart: always
    privileged: true
    volumes:
      - /var/run:/var/run
    ports:
      - '${ZBX_AGENT_PORT:-10050}:10050'
    environment:
      ZBX_HOSTNAME: ${ZBX_AGENT_HOSTNAME:-Zabbix server}
      ZBX_SERVER_HOST: zabbix-server
    depends_on:
      zabbix-server:
        condition: service_started
